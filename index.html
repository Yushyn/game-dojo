<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<!-- Safari на iPhone не вміє розгортати сторінки на весь екран.
     Але вміє інше: якщо додати гру на домашній екран, вона
     запуститься БЕЗ жодних панелей браузера і одразу горизонтально.
     Оці чотири рядки — саме про це. -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cinderhella">
<meta name="theme-color" content="#07060b">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>Game Dojo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&display=swap">

<style>
  :root {
    /* Стара палітра ігрової панелі — лишається як була */
    --bg: #0c0b12;
    --panel: #16141f;
    --line: #2b2840;
    --ink: #e8e6f0;
    --dim: #8b869e;
    --accent: #7bdff2;
    --gold: #ffd166;

    /* Палітра екранів меню: бальний зал при свічках */
    --night:      #07060b;   /* глибокий чорний із синцем */
    --velvet:     #180d18;   /* винний оксамит */
    --candle:     #d8ab63;   /* золото свічки */
    --candle-lit: #f4dfb4;   /* золото на світлі */
    --bone:       #ece3d4;   /* колір тексту */
    --ash:        #9a8f9c;   /* приглушений текст */
    --rose:       #b4788c;   /* та сама рожева, що й опора */

    --display: 'Cinzel', 'Trajan Pro', Georgia, serif;
    --prose:   'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --mono:    ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    margin: 0;
    -webkit-user-select: none; user-select: none;   /* щоб довгий тап не виділяв текст */
    background: var(--night);
    color: var(--bone);
    font: 15px/1.5 var(--mono);
    -webkit-font-smoothing: antialiased;
  }

  /* ══ ЕКРАНИ ══════════════════════════════════════════════════
     Видно рівно один. Перемикає src/screens.js. */
  /* Екрани сховані, показує потрібний src/screens.js.
     ВИНЯТОК: перший, чорний екран має клас .on прямо в розмітці —
     щоб його було видно навіть якщо код узагалі не запустився. */
  .screen { display: none; }
  /* 100dvh, а не 100vh: на мобільних адресний рядок то зʼявляється,
     то зникає, і 100vh залишає під ним смугу порожнечі. */
  .screen.on { display: grid; place-items: center; height: 100dvh; padding: 0; }
  .screen-game.on {
    display: flex; align-items: flex-start; gap: 12px;
    height: 100dvh; place-items: initial;
    /* env(safe-area-*) — це вирізи під камеру й смужку жестів.
       На звичайних екранах усі нулі, тож поводиться як 10px. */
    padding: 10px calc(10px + env(safe-area-inset-right))
             calc(10px + env(safe-area-inset-bottom))
             calc(10px + env(safe-area-inset-left));
  }

  /* Рамка 16:9 — той самий кадр, що й полотно гри,
     щоб меню й гра не стрибали по розміру. */
  /* Раніше тут була рамка 16:9 по центру. Тепер вона займає весь
     екран будь-якої форми: відео й фон обрізаються по краях
     (object-fit: cover), а меню стоїть відносно країв вікна. */
  .frame {
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    border: 0;
  }
  .frame-art {
    background: var(--night) center / cover no-repeat;
  }
  /* Затемнення під текст. Лежить над відео, але під написами,
     і кліків не ловить. У відео є спалах блискавки — без цього
     шару в цю мить меню стає нечитабельним. */
  .frame-art::before {
    content: '';
    position: absolute; inset: 0; z-index: 1;
    background:
      linear-gradient(to bottom right, rgba(7,6,11,0) 42%, rgba(7,6,11,.78) 100%),
      radial-gradient(115% 85% at 25% 35%, rgba(7,6,11,0) 35%, rgba(7,6,11,.72) 100%);
  }
  .frame-art > * { position: relative; z-index: 2; }
  .frame-art > video.bg-video {
    position: absolute; inset: 0; z-index: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .veil { position: absolute; inset: 0; background: rgba(7,6,11,.78); }

  /* ══ ЧОРНИЙ ЕКРАН «PRESS TO START» ═══════════════════════════
     Чорне тло на весь екран, жодної графіки, одна кнопка. */
  .screen-press.on { background: #000; padding: 0; }
  .press {
    all: unset;
    cursor: pointer;
    font-family: var(--mono);
    font-size: clamp(14px, 1.5vw, 20px);
    letter-spacing: .32em;
    color: #cfc9c0;
    padding: 14px 20px;
    animation: pulse 2.4s ease-in-out infinite;
    transition: color .2s;
  }
  .press:hover, .press:focus-visible { color: #fff; animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .38 } }

  .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 8%;
  }
  .logo {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(28px, 4.4vw, 62px);
    letter-spacing: .1em;
    color: var(--candle-lit);
    margin: 0;
    text-shadow: 0 0 42px rgba(216,171,99,.28), 0 2px 20px rgba(0,0,0,.9);
  }
  /* ══ ЗАВАНТАЖЕННЯ ════════════════════════════════════════════ */
  .load-note {
    font-family: var(--prose); font-style: italic;
    font-size: clamp(15px, 1.5vw, 21px);
    color: var(--ash); margin: 0;
  }
  /* Екран завантаження — теж суцільно чорний, без рамки:
     червоне на чорному читається найкраще. */
  .screen-loading.on { background: #000; padding: 0; }
  .load-block { display: flex; flex-direction: column; align-items: center; }

  /* Сліди. Кожен шар — та сама картинка, обрізана по одному
     відбитку, і вони проявляються знизу вгору один за одним. */
  .feet {
    position: relative;
    height: clamp(240px, 52vh, 460px);
    aspect-ratio: 101 / 440;
    margin-bottom: 28px;
  }
  .feet i {
    position: absolute; inset: 0;
    background: center / contain no-repeat;
    opacity: 0;
    /* світіння, щоб бліді відбитки не тонули в чорному */
    filter: drop-shadow(0 0 9px rgba(255, 40, 40, .5));
    animation: stepUp var(--cycle, 2.6s) linear infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes stepUp {
    0%   { opacity: 0 }
    9%   { opacity: 1 }
    68%  { opacity: 1 }
    84%  { opacity: 0 }
    100% { opacity: 0 }
  }
  .load-pct {
    font-family: var(--mono); font-size: 12px; letter-spacing: .2em;
    color: var(--ash); margin: 16px 0 0;
  }

  /* ══ ГОЛОВНЕ МЕНЮ ════════════════════════════════════════════ */
  /* Права колона меню: лого, під ним три кнопки. */
  .menu-col {
    position: absolute; right: 4.5%; bottom: 6%;
    display: flex; flex-direction: column; align-items: center;
    gap: 2.6vh;
  }
  .brand { display: block; }
  .brand img {
    display: block;
    width: clamp(312px, 44vh, 598px);   /* на 30% більший за початковий */
    height: auto;
    filter: drop-shadow(0 6px 28px rgba(0,0,0,.85));
  }
  .menu { display: grid; gap: 1.6vh; justify-items: center; }

  /* Кнопка — картинка художника, розтягнута по правилу 88|100|88:
     бокові краї лишаються як намальовані, тягнеться лише середина.
     Тому напис будь-якої довжини не ламає рамку. */
  .menu-item {
    all: unset;
    cursor: pointer;
    --h: clamp(48px, 9vh, 96px);
    box-sizing: border-box;
    height: var(--h);
    width: calc(var(--h) * 3.9);   /* ширина кнопки. Тягнеться лише середина */
    display: flex; align-items: center; justify-content: center;
    border-style: solid;
    border-width: 0 calc(var(--h) * .7928);   /* 88 / 111 від висоти */
    border-image-source: url('assets/btn-default.png');
    border-image-slice: 0 88 fill;
    border-image-repeat: stretch;

    font-family: var(--display);
    font-size: calc(var(--h) * .26);
    letter-spacing: .05em;
    color: #e9dfcd;
    text-shadow: 0 2px 6px rgba(0,0,0,.9);
    white-space: nowrap;
    transition: color .15s;
  }
  .menu-item:hover, .menu-item:focus-visible {
    border-image-source: url('assets/btn-hover.png');
    color: #fff;
  }
  .menu-item:active {
    border-image-source: url('assets/btn-pressed.png');
    color: #cfc3b2;
  }

  .tiny-row { display: flex; gap: 18px; }

  /* Службові написи — навмисно тихі, щоб не сперечались із кнопками */
  .mute {
    all: unset; cursor: pointer;
    font-family: var(--mono); font-size: 11px; letter-spacing: .16em;
    color: rgba(236,227,212,.45);
    padding: 6px 4px;
    transition: color .2s;
  }
  .mute:hover, .mute:focus-visible { color: var(--candle-lit); }

  /* ══ СТОРІНКИ (лідерборд, автори) ════════════════════════════ */
  .page {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 5% 8%;
  }
  .page-title {
    font-family: var(--display); font-weight: 400;
    font-size: clamp(20px, 2.4vw, 34px);
    letter-spacing: .14em; color: var(--candle-lit);
    margin: 0 0 6px;
  }
  .page-body {
    width: min(560px, 100%);
    max-height: 62%;
    overflow-y: auto;
    margin: 22px 0 0;
  }
  .board-big { list-style: none; margin: 0; padding: 0; font-family: var(--prose); }
  .board-big li {
    display: flex; gap: 16px; align-items: baseline;
    padding: 9px 2px;
    border-bottom: 1px solid rgba(236,227,212,.1);
    font-size: clamp(16px, 1.6vw, 22px);
  }
  .board-big .rank { color: var(--ash); width: 2em; font-family: var(--mono); font-size: .8em; }
  .board-big .who  { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-big .pts  { color: var(--candle); }
  .board-big li.empty { color: var(--ash); border: 0; font-style: italic; justify-content: center; }

  .credits-list { font-family: var(--prose); text-align: center; }
  .credits-role {
    font-family: var(--mono); font-size: 11px; letter-spacing: .22em;
    color: var(--ash); margin: 26px 0 8px;
  }
  .credits-role:first-child { margin-top: 0; }
  .credits-name { font-size: clamp(17px, 1.8vw, 25px); color: var(--bone); margin: 3px 0; }

  .back {
    all: unset; cursor: pointer;
    /* all:unset скидає і z-index, тому ставимо його явно —
       інакше шар .page перекриває кнопку і клік не доходить. */
    position: absolute; left: 5%; bottom: 8%; z-index: 2;
    font-family: var(--prose); font-size: clamp(15px, 1.5vw, 21px);
    color: var(--ash);
    border-bottom: 1px solid transparent;
    transition: color .25s, border-color .25s;
  }
  .back:hover, .back:focus-visible { color: var(--candle-lit); border-bottom-color: var(--candle); }

  /* ══ ЕКРАН ГРИ — як було ═════════════════════════════════════ */
  /* Написи ігрової панелі. Селектори навмисно вузькі, щоб ці
     правила не діставали заголовків на екранах меню. */
  .hud-title, aside h2 {
    font-size: 13px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--dim); margin: 0 0 10px; font-weight: 500; font-family: var(--mono);
  }
  aside h2 { font-size: 12px; letter-spacing: .16em; }

  /* Полотно 1920×1080. Внутрішній розмір фіксований, на екран
     розтягується через CSS зі збереженням пропорції 16:9. */
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    max-height: calc(100dvh - 76px);
    background: #12111a;
    border: 1px solid var(--line);
    margin-inline: auto;
    cursor: crosshair;
    touch-action: none;   /* щоб на планшеті не скролилась сторінка */
  }
  .stage { flex: 1 1 auto; min-width: 0; }
  .hud {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 8px; color: var(--dim); font-size: 13px;
  }
  .hud b { color: var(--gold); font-weight: 600; }

  aside {
    flex: 0 0 clamp(220px, 21vw, 300px);
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 16px;
    max-height: calc(100dvh - 20px);
    overflow-y: auto;
    font-family: var(--mono);
  }
  .sep { height: 1px; background: var(--line); margin: 18px 0; }

  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tools button { padding: 9px 6px; font-size: 13px; text-align: center; }
  .tools button.wide { grid-column: 1 / -1; }
  .tools button.on { border-color: var(--accent); color: var(--accent); background: #101a1f; }

  button.primary {
    margin-top: 16px; padding: 12px 10px;
    border-color: var(--accent); color: var(--accent);
    background: #101a1f; font-size: 15px;
  }
  button.primary:hover { background: #16242b; }

  button.ghost {
    margin: 0 0 14px; padding: 6px 8px; font-size: 12px;
    color: var(--dim); background: transparent;
  }

  .stats { margin-top: 18px; }
  .stat {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 6px 0; border-bottom: 1px solid var(--line);
    font-size: 13px; color: var(--dim);
  }
  .stat b { color: var(--ink); font-weight: 600; font-size: 15px; }
  .stat b.gold { color: var(--gold); }
  .stat b.warn { color: #ff7a7a; }

  aside ol { list-style: none; margin: 0 0 14px; padding: 0; }
  aside li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  aside li.empty { color: var(--dim); border: 0; font-size: 13px; }
  aside .rank { color: var(--dim); width: 1.5em; }
  aside .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside .pts { color: var(--gold); }

  aside input, aside button {
    font: inherit; width: 100%; padding: 8px 10px;
    background: #0c0b12; color: var(--ink); border: 1px solid var(--line);
  }
  aside button { cursor: pointer; margin-top: 8px; }
  aside button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  aside button:disabled { opacity: .5; cursor: default; }
  .status { color: var(--dim); font-size: 12px; min-height: 2em; margin-top: 8px; }
  .keys { color: var(--dim); font-size: 11px; margin-top: 14px; line-height: 1.7; }
  .keys b { color: var(--ink); font-weight: 600; }

  :focus-visible { outline: 1px solid var(--candle); outline-offset: 3px; }

  /* Телефон боком: висота маленька, і кожен піксель на рахунку.
     Панель вужчає, службові написи ховаються, полотно лишається
     головним. Розкладку в стовпчик тут НЕ вмикаємо — це зжерло б
     висоту, якої й так немає. */
  @media (max-height: 560px) {
    .screen-game.on { padding: 6px; gap: 8px; }
    .hud-title, .keys, .stats { display: none; }
    aside { flex: 0 0 190px; padding: 10px; font-size: 12px; }
    aside h2 { margin-bottom: 6px; }
    canvas { max-height: calc(100dvh - 34px); }
    .hud { font-size: 11px; margin-top: 4px; }
  }

  /* Вузьке вікно на десктопі — тут місце ще є, можна в стовпчик. */
  @media (max-width: 1000px) and (min-height: 561px) {
    .screen-game.on { flex-wrap: wrap; overflow-y: auto; }
    .stage { flex: 1 1 100%; }
    aside { flex: 1 1 100%; max-height: none; }
  }

  /* Телефон вертикально: грати так неможливо, просимо повернути. */
  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotate {
      display: flex; position: fixed; inset: 0; z-index: 90;
      background: #000; color: var(--bone);
      flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; text-align: center; padding: 0 12%;
      font-family: var(--prose); font-size: 21px; font-style: italic;
    }
    #rotate svg { width: 76px; height: 76px; opacity: .8; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    .feet i { animation: none; opacity: 1; }   /* просто показуємо весь слід */
  }
</style>
</head>
<body>

<!-- ══ 1. ЧОРНИЙ ЕКРАН ══════════════════════════════════════════
     Тут нічого немає, крім однієї кнопки, і це навмисно.
     Браузер забороняє грати звук, доки людина хоч раз не клацне
     по сторінці. Цей клік і є дозволом: після нього ми вмикаємо
     аудіо, і далі музика вже може стартувати сама. -->
<section class="screen screen-press on" data-screen="press">
  <button class="press" id="s-press" data-go="loading">PRESS TO START</button>
</section>

<!-- ══ 2. ЗАВАНТАЖЕННЯ ═══════════════════════════════════════════
     Смужка показує справжній прогрес: фон, стопа, чоботи. -->
<section class="screen screen-loading" data-screen="loading">
  <div class="load-block">
    <!-- Сліди збирає src/screens.js з одного аркуша assets/loading-feet.png -->
    <div class="feet" id="s-feet"></div>
    <p class="load-note" id="s-load-note">Готуємо сцену</p>
    <p class="load-pct" id="s-load-pct">0%</p>
  </div>
</section>

<!-- ══ 3. ГОЛОВНЕ МЕНЮ ══════════════════════════════════════════ -->
<section class="screen screen-menu" data-screen="menu">
  <div class="frame frame-art" data-art>
    <!-- Тло меню. Файл підставляє src/screens.js, поки відео не
         почалося — видно кадр-заставку, той самий кадр. -->
    <video class="bg-video" id="s-menu-video" muted loop playsinline preload="auto"></video>
    <div class="menu-col">
      <picture class="brand">
        <source srcset="assets/logo.webp" type="image/webp">
        <img id="s-logo" src="assets/logo.png" alt="Cinderhella — Fit or Die">
      </picture>
      <nav class="menu">
        <button class="menu-item" data-go="game"        id="s-go-game">New Game</button>
        <button class="menu-item" data-go="leaderboard" id="s-go-board">Leaderboards</button>
        <button class="menu-item" data-go="credits"     id="s-go-credits">Credits</button>
      </nav>
      <div class="tiny-row">
        <button class="mute" id="s-mute" aria-label="Sound">Sound: turn off</button>
        <button class="mute" id="s-full" aria-label="Fullscreen">Fullscreen</button>
      </div>
    </div>
  </div>
</section>

<!-- Музика меню. Джерело підставляє src/screens.js. -->
<!-- Видно тільки на телефоні, повернутому вертикально. -->
<div id="rotate">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="7" y="2" width="10" height="20" rx="2"/>
    <path d="M3 15a9 9 0 0 0 4 5" stroke-linecap="round"/>
    <path d="M21 9a9 9 0 0 0-4-5" stroke-linecap="round"/>
  </svg>
  <p id="s-rotate-text" style="margin:0">Rotate your device</p>
</div>

<audio id="s-music" loop preload="auto"></audio>
<audio id="s-music-game" loop preload="auto"></audio>
<!-- Грім. Не зациклений: його щоразу перезапускає відео меню,
     щоб спалах і удар лишались на своїх місцях. -->
<audio id="s-thunder" preload="auto"></audio>

<!-- ══ 4. ЛІДЕРБОРД ═════════════════════════════════════════════ -->
<section class="screen screen-page" data-screen="leaderboard">
  <div class="frame frame-art" data-art>
    <div class="veil"></div>
    <div class="page">
      <h2 class="page-title" id="s-board-title">Лідерборд</h2>
      <div class="page-body">
        <ol class="board-big" id="board-full"><li class="empty">Завантаження…</li></ol>
      </div>
    </div>
    <button class="back" data-go="menu">Назад</button>
  </div>
</section>

<!-- ══ 5. АВТОРИ ════════════════════════════════════════════════ -->
<section class="screen screen-page" data-screen="credits">
  <div class="frame frame-art" data-art>
    <div class="veil"></div>
    <div class="page">
      <h2 class="page-title" id="s-credits-title">Автори</h2>
      <div class="page-body">
        <div class="credits-list" id="credits-list"></div>
      </div>
    </div>
    <button class="back" data-go="menu">Назад</button>
  </div>
</section>

<!-- ══ 6. ГРА ═══════════════════════════════════════════════════ -->
<section class="screen screen-game" data-screen="game">
  <div class="stage">
    <h1 class="hud-title" id="title">Game Dojo</h1>
    <canvas id="stage"></canvas>
    <div class="hud">
      <span id="hint">Тягни мишкою по стопі</span>
    </div>
  </div>

  <aside>
    <button class="ghost" data-go="menu">← До меню</button>

    <h2 id="tools-title">Інструмент</h2>
    <div class="tools">
      <button data-tool="push" id="tool-push">Рухати</button>
      <button data-tool="restore" id="tool-restore">Відновити</button>
    </div>

    <button id="action" class="primary">Почати</button>

    <div class="stats">
      <div class="stat"><span>Раунд</span><b id="round">—</b></div>
      <div class="stat"><span>Чобіт</span><b id="boot-name">—</b></div>
      <div class="stat"><span>Час</span><b id="timer">—</b></div>
      <div class="stat"><span>Очки</span><b id="score" class="gold">0</b></div>
    </div>

    <p class="keys">
      <b>1</b> — Рухати, <b>2</b> — Відновити<br>
      <b>Ctrl+Z</b> — крок назад<br>
      Рожеве коло — опора, там стопа не рухається
    </p>

    <div class="sep"></div>

    <h2 id="board-title">Топ-10</h2>
    <ol id="board"><li class="empty">Завантаження…</li></ol>
    <input id="name" maxlength="24" placeholder="Твоє імʼя" aria-label="Твоє імʼя">
    <button id="save">Зберегти результат</button>
    <p class="status" id="status"></p>
  </aside>
</section>

<!-- Звичайний скрипт, не модуль: він єдиний, що працює при відкритті
     файлу з диска. Його завдання — пояснити, чому решта не працює. -->
<script>
if (location.protocol === 'file:') {
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;z-index:99;background:#0c0b12;' +
      'display:flex;align-items:center;justify-content:center;padding:40px;';
    box.innerHTML =
      '<div style="max-width:640px;border:1px solid #ff7a7a;background:#16141f;padding:28px 32px;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#e8e6f0">' +
      '<h2 style="margin:0 0 14px;color:#ff7a7a;font-size:20px;letter-spacing:0;text-transform:none">' +
      'Сторінку відкрито неправильно</h2>' +
      '<p style="margin:0 0 14px;color:#e8e6f0">Ти відкрила файл подвійним кліком, ' +
      'прямо з диска. Так браузер із міркувань безпеки блокує весь код сторінки — ' +
      'тому нічого й не працює.</p>' +
      '<p style="margin:0 0 14px;color:#e8e6f0">Потрібен локальний сервер. ' +
      'У VS Code: постав розширення <b>Live Server</b>, потім правою кнопкою по ' +
      '<b>index.html</b> → <b>Open with Live Server</b>.</p>' +
      '<p style="margin:0;color:#8b869e;font-size:13px">Або в папці проєкту відкрий ' +
      'командний рядок і виконай <b style="color:#7bdff2">npx live-server</b></p>' +
      '</div>';
    document.body.appendChild(box);
  });
}
</script>
<!-- Сторож запуску. Теж звичайний скрипт, не модуль.
     Якщо через 5 секунд гра не подала ознак життя — значить,
     якогось файлу в папці src/ немає або він із помилкою.
     Раніше в такому разі був просто чорний екран без пояснень. -->
<script>
if (location.protocol !== 'file:') {
  setTimeout(function () {
    if (window.__gameBooted) return;
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;z-index:98;background:#0c0b12;' +
      'display:flex;align-items:center;justify-content:center;padding:40px;' +
      'font:15px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#e8e6f0';
    box.innerHTML =
      '<div style="max-width:640px;border:1px solid #ff7a7a;background:#16141f;padding:28px 32px">' +
      '<h2 style="margin:0 0 14px;color:#ff7a7a;font-size:20px;letter-spacing:0;text-transform:none">' +
      'Гра не запустилась</h2>' +
      '<p style="margin:0 0 14px">Код не виконався. Майже завжди це означає, що в папці ' +
      '<b>src</b> бракує якогось файлу — наприклад, папку замінили цілком, ' +
      'разом із тими файлами, яких не було в архіві.</p>' +
      '<p style="margin:0 0 14px">У src/ має лежати шість файлів: <b>config.js, tuning.js, ' +
      'game.js, main.js, db.js, screens.js</b>.</p>' +
      '<p style="margin:0 0 14px">Відкрий <b style="color:#7bdff2">check.html</b> — він покаже, ' +
      'якого саме бракує. Точна причина також є у F12 → Console.</p>' +
      '<p style="margin:0;color:#8b869e;font-size:13px">Якщо файли на місці — надішли цей ' +
      'екран і вміст консолі.</p>' +
      '</div>';
    document.body.appendChild(box);
  }, 5000);
}
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
